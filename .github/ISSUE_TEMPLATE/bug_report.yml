name: Bug report
description: Report a reproducible AM Configurator problem
title: "[Bug] "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. Remove API keys, device serials,
        personal paths, and private macro/profile contents. Attach only a
        minimal sanitized profile when it is necessary to reproduce the issue.

  - type: dropdown
    id: keyboard
    attributes:
      label: Keyboard
      options:
        - AM Neon 80
        - AM Relic 80
        - AM AFA / AFA 2
        - CyberBoard
        - Other / no keyboard connected
    validations:
      required: true

  - type: input
    id: firmware
    attributes:
      label: Firmware identity or version
      description: Include the identity shown by Devices, if available.
      placeholder: "For example: NEON80"

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS arm64
        - Windows 11 x64
        - Linux x86-64
        - Other
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: AM Configurator version
      description: Open About and copy the displayed version.
      placeholder: "0.1.68"
    validations:
      required: true

  - type: dropdown
    id: operation
    attributes:
      label: Area or operation
      options:
        - Installation / launch
        - Device detection / read / write
        - Keymap
        - Macros
        - Lighting paint / media import / local animation
        - Library / profile import
        - Optional AI / Ollama
        - Optional AI / remote API
        - Other
    validations:
      required: true

  - type: dropdown
    id: write
    attributes:
      label: Did this involve a confirmed full keyboard write?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true

  - type: input
    id: installer
    attributes:
      label: Installer filename or source run
      description: Give the exact release filename, or say that you ran from source.
      placeholder: "AM-Configurator-0.1.68-macOS-arm64.dmg"

  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Start from app launch and list the smallest reliable sequence.
      placeholder: |
        1. Launch AM Configurator
        2. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected result
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Include the exact visible error and whether retrying changed it.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs or minimal profile details
      description: |
        Remove API keys, device serials, usernames, personal paths, private
        macro text, and unrelated profile data. Do not upload a complete private
        configuration.
      render: shell

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I verified the exact app version in About.
          required: true
        - label: I closed AM Master, Vial, VIA, QMK Toolbox, and other keyboard tools for a device issue.
        - label: I have a backup if this report involves a full keyboard write.
        - label: I removed secrets and private configuration content from this report.
          required: true
