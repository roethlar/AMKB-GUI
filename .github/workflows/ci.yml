# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            python: "3.12"
          - name: Windows
            os: windows-latest
            python: "3.12"
          - name: Linux
            os: ubuntu-latest
            python: "3.12"
          # pyproject declares requires-python = ">=3.11" and library.py carries
          # an explicit CPython 3.11.10 branch, so the floor must be exercised.
          - name: Linux · Python 3.11
            os: ubuntu-latest
            python: "3.11"
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Install test environment
        run: uv sync --locked
      - name: Run unit tests
        run: uv run --frozen python -m unittest discover -s tests -v
      - name: Check source compilation
        run: uv run --frozen python -m compileall -q am_configurator packaging build_tools
      - name: Run browser tests
        run: node --test tests/web/*.test.js
      - name: Check lighting state JavaScript
        run: node --check am_configurator/web/lighting_state.js
      - name: Check lighting review JavaScript
        run: node --check am_configurator/web/lighting_review.js
      - name: Check lighting targets JavaScript
        run: node --check am_configurator/web/lighting_targets.js
      - name: Check lighting composer JavaScript
        run: node --check am_configurator/web/lighting_composer.js
      - name: Check Library state JavaScript
        run: node --check am_configurator/web/library_state.js
      - name: Check application JavaScript
        run: node --check am_configurator/web/app.js
      - name: Build Python distributions
        run: uv build
