# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Desktop installers

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  installer:
    name: Installer · ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: macos
            bundle: dist/AM Configurator.app
            artifact: macOS-Installer
            installer: dist/*.dmg
          - name: Windows x64
            os: windows-latest
            platform: windows
            bundle: dist/AM Configurator
            artifact: Windows-x64-Installer
            installer: dist/*-Setup.exe
          - name: Linux x86-64
            os: ubuntu-latest
            platform: linux
            bundle: dist/AM Configurator
            artifact: Linux-x86_64-AppImage
            installer: dist/*.AppImage
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
          enable-cache: true
          prune-cache: true
      - name: Install native build prerequisites (Linux)
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc \
            pkg-config \
            libcairo2-dev \
            libgirepository1.0-dev \
            gir1.2-gtk-3.0 \
            gir1.2-webkit2-4.1 \
            libwebkit2gtk-4.1-dev \
            xauth \
            xvfb
      - name: Install desktop build environment
        run: uv sync --locked --extra desktop --extra build
      - name: Read canonical application version
        id: build_version
        run: uv run --frozen python build_tools/release_info.py version --github-output
      - name: Build native application
        run: uv run --frozen --extra desktop --extra build pyinstaller --noconfirm --clean packaging/am_configurator.spec
      - name: Audit frozen native tree
        run: uv run --frozen python build_tools/native_tree_audit.py "${{ matrix.bundle }}"
      - name: Verify native webview policy (macos)
        if: matrix.platform == 'macos'
        run: '"dist/AM Configurator.app/Contents/MacOS/AM Configurator" --native-policy-smoke'
      - name: Verify native webview policy (windows)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: '& "dist/AM Configurator/AM Configurator.exe" --native-policy-smoke'
      - name: Verify native webview policy (linux)
        if: matrix.platform == 'linux'
        run: xvfb-run --auto-servernum --server-args="-screen 0 1280x960x24" "dist/AM Configurator/AM Configurator" --native-policy-smoke
      - name: Build and test macOS DMG
        if: matrix.platform == 'macos'
        run: packaging/macos/build_dmg.sh
      - name: Build and test Windows installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: ./packaging/windows/build_installer.ps1
      - name: Build and test Linux AppImage
        if: matrix.platform == 'linux'
        run: packaging/linux/build_appimage.sh
      - name: Upload native installer
        uses: actions/upload-artifact@v7
        with:
          name: AM-Configurator-${{ steps.build_version.outputs.version }}-${{ matrix.artifact }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 30

  candidate-metadata:
    name: Candidate metadata
    needs: installer
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Read canonical application version
        id: build_version
        run: python build_tools/release_info.py version --github-output
      - name: Download native installers
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AM-Configurator-${{ steps.build_version.outputs.version }}-*
          path: candidate-installers
          merge-multiple: true
      - name: Generate release metadata
        run: |
          mkdir -p candidate-metadata
          python build_tools/release_manifest.py \
            --version "${{ steps.build_version.outputs.version }}" \
            --commit "${{ github.sha }}" \
            --run-id "${{ github.run_id }}" \
            --run-number "${{ github.run_number }}" \
            --repository "${{ github.repository }}" \
            --input-dir candidate-installers \
            --manifest candidate-metadata/release-manifest.json \
            --checksums candidate-metadata/SHA256SUMS.txt
      - name: Upload candidate metadata
        uses: actions/upload-artifact@v7
        with:
          name: AM-Configurator-${{ steps.build_version.outputs.version }}-candidate-metadata
          path: |
            candidate-metadata/release-manifest.json
            candidate-metadata/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 30

  provenance:
    name: Release provenance
    needs: [installer, candidate-metadata]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - name: Read canonical application version
        id: build_version
        run: python build_tools/release_info.py version --github-output
      - name: Download release subjects
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: AM-Configurator-${{ steps.build_version.outputs.version }}-*
          path: candidate-provenance
          merge-multiple: true
      - name: Attest macOS installer
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: candidate-provenance/AM-Configurator-${{ steps.build_version.outputs.version }}-macOS-arm64.dmg
      - name: Attest Windows installer
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: candidate-provenance/AM-Configurator-${{ steps.build_version.outputs.version }}-Windows-x64-Setup.exe
      - name: Attest Linux installer
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: candidate-provenance/AM-Configurator-${{ steps.build_version.outputs.version }}-Linux-x86_64.AppImage
      - name: Attest release metadata
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: |
            candidate-provenance/release-manifest.json
            candidate-provenance/SHA256SUMS.txt
