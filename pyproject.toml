[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "am-configurator"
version = "0.1.0"
description = "Standalone Angry Miao keyboard configurator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
  "hidapi>=0.14.0",
  "keyring==25.7.0",
  "pillow>=10.0",
  "pyserial>=3.5",
]

[project.optional-dependencies]
desktop = [
  "pywebview>=6.2.1",
  "pywebview[qt]>=6.2.1; sys_platform == 'linux'",
]
build = ["pyinstaller>=6.21.0"]

[project.gui-scripts]
am-configurator = "am_configurator.desktop:main"

[tool.hatch.build.targets.wheel]
packages = ["am_configurator"]
# Non-Python files are not picked up by `packages` alone. The udev rule has to
# reach wheel users because the Linux permission error instructs them to install
# it, and a wheel user has no source archive.
artifacts = ["am_configurator/data/*.rules"]

# Allowlist, not a denylist. Governance artifacts are installed by an external
# toolkit, so anything not named here must stay out of published artifacts by
# default; a denylist would have to be extended on every toolkit refresh and
# fails open when it is not. tests/test_packaging.py guards both directions.
[tool.hatch.build.targets.sdist]
# Every pattern is root-anchored with a leading "/": these are gitignore-style,
# so a bare "README.md" would also match docs/verification/*/README.md and drag
# internal material back in. Nested files still ship via their parent directory
# (packaging/ffmpeg/README.md comes in under "/packaging/").
include = [
  "/am_configurator/",
  "/assets/",
  "/build_tools/",
  "/docs/images/",
  "/packaging/",
  "/tests/",
  "/build.py",
  "/LICENSE",
  "/README.md",
  "/THIRD_PARTY_NOTICES",
  "/pyproject.toml",
  "/uv.lock",
]
