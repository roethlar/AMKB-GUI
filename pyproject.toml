[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "am-configurator"
dynamic = ["version"]
description = "Standalone Angry Miao keyboard configurator"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
# The project's own MIT license plus every preserved third-party notice must
# travel inside the wheel (dist-info/licenses/), not only the sdist. The
# CyberBoard protocol layer derives from MIT-licensed cyberboard-cli, whose
# copyright notice MIT requires in every copy.
license-files = ["LICENSE", "THIRD_PARTY_NOTICES", "licenses/cyberboard-cli-LICENSE.txt"]
dependencies = [
  "certifi>=2026.7.22",
  "hidapi>=0.14.0",
  "keyring==25.7.0",
  "pillow>=10.0",
  "pyserial>=3.5",
]

[project.optional-dependencies]
desktop = [
  "pywebview>=6.2.1",
  "pywebview[gtk]>=6.2.1; sys_platform == 'linux'",
]
build = ["pyinstaller>=6.21.0"]

[project.gui-scripts]
am-configurator = "am_configurator.desktop:main"

[tool.hatch.version]
path = "am_configurator/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["am_configurator"]
# Non-Python files are not picked up by `packages` alone. The udev rule has to
# reach wheel users because the Linux permission error instructs them to install
# it, and a wheel user has no source archive.
artifacts = ["am_configurator/data/*.rules"]

# Allowlist, not a denylist. Governance artifacts are installed by an external
# toolkit, so anything not named here must stay out of published artifacts by
# default; a denylist would have to be extended on every toolkit refresh and
# fails open when it is not. tests/test_packaging.py guards both directions.
[tool.hatch.build.targets.sdist]
# Every pattern is root-anchored with a leading "/": these are gitignore-style,
# so a bare "README.md" would also match docs/verification/*/README.md and drag
# internal material back in. Nested files still ship through included parent
# directories.
include = [
  "/am_configurator/",
  "/assets/",
  "/build_tools/",
  "/docs/images/",
  "/packaging/",
  "/tests/",
  "/build.py",
  "/LICENSE",
  "/README.md",
  "/THIRD_PARTY_NOTICES",
  "/licenses/",
  "/pyproject.toml",
  "/uv.lock",
]
